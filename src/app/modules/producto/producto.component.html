<div class="contenido">
  <div class="card-container" *ngFor="let p of productos">
    <mat-card class="example-card" appearance="outlined">
      <mat-card-header>
        <div mat-card-avatar class="example-header-image" style="background-image: url('{{p.imagen}}');"></div>
        <mat-card-title>{{p.nombre}}</mat-card-title>
        <mat-card-subtitle>{{p.marca}}</mat-card-subtitle>
      </mat-card-header>
      <img mat-card-image src="{{p.imagen}}" alt="{{p.alt}}" class="phone-image">
      <mat-card-content>
        <p class="description">{{p.descripcion}}</p>
        <p class="price">${{p.precio}}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" class="like-button">Comprar ahora</button>
        <button mat-button color="accent" class="share-button" (click)="agregarAlCarrito()">Agregar al carrito</button>
      </mat-card-actions>      
    </mat-card>
  </div>
</div>
