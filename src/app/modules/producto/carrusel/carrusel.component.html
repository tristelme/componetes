<!-- carrusel.component.html -->
<div class="carousel-container">
    <div class="carousel" [style.transform]="carouselTransform">
      <div class="carousel-slide" *ngFor="let image of images">
        <img [src]="image.src" alt="carousel image" />
      </div>
    </div>
    <button class="prev" (click)="moveSlide('prev')">&#10094;</button>
    <button class="next" (click)="moveSlide('next')">&#10095;</button>
  </div>
