<div class="contenido">
  <div class="card-container" *ngFor="let i of info">
    <div class="custom-card">
      <!-- Usamos ngStyle para evitar problemas con las comillas -->
      <div class="card-header" [ngStyle]="{'background-image': 'url(' + i.imagen + ')'}">
        <div class="header-text">
          <h2 class="card-title">{{i.titulo}}</h2>
          <p class="card-subtitle">{{i.marca}}</p>
        </div>
      </div>
      <div class="card-body">
        <img [src]="i.imagen" [alt]="i.alt || 'Imagen del producto'" class="card-image" />
        <p class="description">{{i.descripcion}}</p>
      </div>
      <div class="card-actions">
        <button class="btn buy-btn">Comprar ahora</button>
        <button class="btn cart-btn" (click)="mostrarAlerta()">Agregar al carrito</button>
      </div>
    </div>
  </div>
</div>
