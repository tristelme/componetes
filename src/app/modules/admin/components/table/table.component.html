<!-- TABLA DE PRODUCTOS -->
<table class="table"> <!-- Se crea una tabla con la clase "table" de Bootstrap para estilizarla -->
    <thead> <!-- Cabecera de la tabla -->
        <tr> <!-- Fila de encabezado de la tabla -->
            <th scope="col">#</th> <!-- Columna para el índice del producto -->
            <th scope="col">Imagen</th> <!-- Columna para mostrar la imagen del producto -->
            <th scope="col">Nombre</th> <!-- Columna para el nombre del producto -->
            <th scope="col">Precio</th> <!-- Columna para el precio del producto -->
            <th scope="col">Descripción</th> <!-- Columna para la descripción del producto -->
            <th scope="col">Categoría</th> <!-- Columna para la categoría del producto -->
            <th scope="col">Acciones</th> <!-- Columna para las acciones (editar, eliminar) -->
        </tr>
    </thead>

    <tbody> <!-- Cuerpo de la tabla, donde se listan los productos -->
        <tr *ngFor="let producto of coleccionProductos"> <!-- Itera sobre la colección de productos -->
            <th scope="row">1</th> <!-- Número de fila (se puede reemplazar con un índice dinámico) -->

            <td> <!-- Columna para la imagen del producto -->
                <img src="{{producto.imagen}}" alt="{{producto.alt}}" width="100px">
                <!-- Muestra la imagen del producto -->
            </td>
            <td>{{producto.nombre}}</td> <!-- Muestra el nombre del producto -->
            <td>{{producto.precio}}</td> <!-- Muestra el precio del producto -->
            <td>{{producto.descripcion}}</td> <!-- Muestra la descripción del producto -->
            <td>{{producto.categoria}}</td> <!-- Muestra la categoría del producto -->

            <!-- ACCIONES -->
            <td> <!-- Columna para las acciones de editar -->
                <button id="btn-edit" title="Editar" type="button" class="btn btn-outline-warning"
                    data-bs-toggle="modal" data-bs-target="#editarProducto" (click)="mostrarEditar(producto)">
                    <mat-icon>edit</mat-icon> <!-- Ícono de editar -->
                </button>
            </td>
            <td> <!-- Columna para las acciones de eliminar -->
                <button id="btn-delete" title="Eliminar" type="button" class="btn btn-outline-danger"
                    data-bs-toggle="modal" data-bs-target="#eliminarProducto" (click)="mostrarBorrar(producto)">
                    <mat-icon>delete</mat-icon> <!-- Ícono de eliminar -->
                </button>
            </td>
        </tr>
    </tbody>
</table>

<!-- BOTÓN DE AGREGAR NUEVOS PRODUCTOS -->
<button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#agregarProducto">
    Agregar un nuevo producto <!-- Botón para abrir el modal de agregar producto -->
</button>

<!-- MODAL PARA AGREGAR NUEVO PRODUCTO -->
<div class="modal fade" id="agregarProducto" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog"> <!-- Dialogo del modal -->
        <div class="modal-content">
            <div class="modal-header"> <!-- Encabezado del modal -->
                <!-- TÍTULO DEL MODAL -->
                <h1 class="modal-title fs-5" id="exampleModalLabel">Ingrese un nuevo producto:</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <!-- Botón para cerrar el modal -->
            </div>

            <!-- CUERPO DEL MODAL-->
            <div [formGroup]="producto" class="modal-body">
                <!-- Formulario para ingresar los datos del nuevo producto -->
                <div class="mb-3"> <!-- Campo para nombre del producto -->
                    <label class="form-label">Ingrese el nombre del producto:</label>
                    <input class="form-control" type="text" formControlName="nombre" placeholder="Ej.: Iphone 16">
                </div>

                <div class="mb-3"> <!-- Campo para descripción del producto -->
                    <label class="form-label">Ingrese una descripción:</label>
                    <input class="form-control" type="text" formControlName="descripcion"
                        placeholder="Ej.: Iphone 16 pro">
                </div>

                <div class="mb-3"> <!-- Campo para precio del producto -->
                    <label class="form-label">Ingrese el precio:</label>
                    <input class="form-control" type="number" formControlName="precio" placeholder="...">
                </div>

                <div class="mb-3"> <!-- Campo para seleccionar categoría del producto -->
                    <label class="form-label">Selecciona una categoría:</label>
                    <select class="form-control" formControlName="categoria" class="form-select">
                        <option selected>Elija una opción</option>
                        <option value="celulares">Celulares</option>
                        <option value="computadoras">Computadoras</option>
                        <option value="relojes">Relojes</option>
                        <option value="tablets">Tablets</option>
                        <option value="televisores">Televisores</option>
                    </select>
                </div>

                <div class="mb-3"> <!-- Campo para ingresar la imagen del producto -->
                    <label class="form-label">Ingrese una imagen:</label>
                    <input class="form-control" type="text" formControlName="imagen"
                        placeholder="Ingrese vínculo de una imagen">
                </div>

                <div class="mb-3"> <!-- Campo para ingresar texto alternativo de la imagen -->
                    <label class="form-label">Ingrese texto alternativo de la imagen:</label>
                    <input class="form-control" type="text" formControlName="alt" placeholder="Ej.: celular iphone">
                </div>
            </div>

            <!-- ACCIONES DEL MODAL -->
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-success" (click)="agregarProducto()"
                    data-bs-dismiss="modal">Guardar</button> <!-- Botón para guardar los datos -->
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <!-- Botón para cancelar y cerrar el modal -->
            </div>
        </div>
    </div>
</div>

<!-- MODAL PARA EDITAR UN PRODUCTO -->
<div class="modal fade" *ngFor="let productoEdit of coleccionProductos" id="editarProducto" tabindex="-1"
    aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <!-- TÍTULO DEL MODAL -->
                <h1 class="modal-title fs-5" id="exampleModalLabel">Edite el siguiente producto:</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                <!-- Botón para cerrar el modal -->
            </div>

            <!-- CUERPO DEL MODAL-->
            <div [formGroup]="producto" class="modal-body"> <!-- Formulario para editar los datos del producto -->
                <div class="mb-3">
                    <label class="form-label">Ingrese el nombre del producto:</label>
                    <input class="form-control" type="text" formControlName="nombre"
                        placeholder="{{productoEdit.nombre}}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Ingrese una descripción:</label>
                    <input class="form-control" type="text" formControlName="descripcion"
                        placeholder="{{productoEdit.descripcion}}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Ingrese el precio:</label>
                    <input class="form-control" type="number" formControlName="precio"
                        placeholder="{{productoEdit.precio}}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Selecciona una categoría:</label>
                    <select class="form-control" formControlName="categoria">
                        <option selected>Elija una opción</option>
                        <option value="celulares">Celulares</option>
                        <option value="computadoras">Computadoras</option>
                        <option value="relojes">Relojes</option>
                        <option value="tablets">Tablets</option>
                        <option value="televisores">Televisores</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ingrese una imagen:</label>
                    <input class="form-control" type="text" formControlName="imagen"
                        placeholder="{{productoEdit.imagen}}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Ingrese texto alternativo de la imagen:</label>
                    <input class="form-control" type="text" formControlName="alt" placeholder="{{productoEdit.alt}}">
                </div>
            </div>

            <!-- ACCIONES DEL MODAL -->
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-success" (click)="editarProducto()"
                    data-bs-dismiss="modal">Guardar cambios</button> <!-- Botón para guardar cambios -->
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>
